version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: dido-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_password}
      MYSQL_DATABASE: ${DB_DATABASE:-dido_store}
      MYSQL_USER: ${DB_USERNAME:-dido_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dido_secret_password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dido-network
    labels:
      - "traefik.enable=false"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: dido-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Dido Store"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:uN2R3Q1e2l6aJ8wFvK5yL3zP9rM0bA7sD4fG6hJ8kL=}
      APP_URL: ${APP_URL:-https://dido-studio.store}
      FRONTEND_URL: ${FRONTEND_URL:-https://dido-studio.store}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-dido_store}
      DB_USERNAME: ${DB_USERNAME:-dido_user}
      DB_PASSWORD: ${DB_PASSWORD:-dido_secret_password}
    volumes:
      - backend_storage:/var/www/html/storage/app/public
    networks:
      - dido-network
    labels:
      - "traefik.enable=false"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: dido-nginx
    restart: unless-stopped
    ports:
      - "${API_PORT:-8002}:80"
    volumes:
      - backend_storage:/var/www/html/storage/app/public:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dido-network
    labels:
      - "traefik.enable=false"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: dido-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      INTERNAL_API_URL: http://nginx:80
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dido-network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.dido-frontend-http.entrypoints=http"
      - "traefik.http.routers.dido-frontend-http.rule=Host(`dido-studio.store`) || Host(`www.dido-studio.store`)"
      - "traefik.http.routers.dido-frontend-http.middlewares=dido-redirect-to-https"
      - "traefik.http.middlewares.dido-redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.dido-redirect-to-https.redirectscheme.permanent=true"
      - "traefik.http.routers.dido-frontend-https.entrypoints=https"
      - "traefik.http.routers.dido-frontend-https.rule=Host(`dido-studio.store`) || Host(`www.dido-studio.store`)"
      - "traefik.http.routers.dido-frontend-https.tls=true"
      - "traefik.http.routers.dido-frontend-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.dido-frontend-https.loadbalancer.server.port=3000"

  phpmyadmin:
    image: phpmyadmin:5
    container_name: dido-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - dev
    networks:
      - dido-network

volumes:
  db_data:
    name: dido-db-data
  backend_storage:
    name: dido-backend-storage

networks:
  dido-network:
    name: dido-network
  coolify:
    external: true
